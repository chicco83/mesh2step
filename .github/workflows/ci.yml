# Mesh2STEP — CI
# Versione: 1.3.0 — 2026-10-06 13:40 (Europe/Rome)
# A ogni push / pull request: genera le mesh di prova, esegue il core, valida gli STEP con
# OpenCASCADE e crea la build single-file (scaricabile come artifact).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Dipendenze di test
        run: pip install trimesh manifold3d cadquery-ocp
      - name: Mesh di prova
        run: python3 tests/make_samples.py
      - name: Analisi + export STEP
        run: node tests/run_core.js
      - name: Validazione OpenCASCADE
        run: python3 tests/check_step.py
      - name: Build single-file
        run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mesh2step-web
          path: dist/*.html
